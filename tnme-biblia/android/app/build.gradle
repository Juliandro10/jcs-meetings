plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jcs.tnme'
    compileSdk 34

    defaultConfig {
        applicationId "com.jcs.tnme"
        minSdk 19
        targetSdk 34
        versionCode 13
        versionName "0.2.8"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
